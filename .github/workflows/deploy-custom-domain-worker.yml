name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/custom-domain-router/**"
      - ".github/workflows/deploy-custom-domain-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-profile-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          [[ -n "$CF_API_TOKEN" ]] || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          }

          [[ -n "$CF_ACCOUNT_ID" ]] || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          }

          [[ -n "$SB_ANON_KEY" ]] || {
            echo "::error::Missing SUPABASE_ANON_KEY secret"
            exit 1
          }

          echo "Required secrets are configured."

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Worker files
        shell: bash
        run: |
          set -euo pipefail

          test -f workers/custom-domain-router/worker.js
          test -f workers/custom-domain-router/wrangler.toml

          echo "Worker files found."

      - name: Verify Wrangler configuration
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --dry-run

      - name: Deploy Worker
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure Supabase Worker secret
        working-directory: workers/custom-domain-router
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY
          echo "Supabase Worker secret configured."

      - name: Verify Worker health
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          URL="https://echchiaa.elbordiji.com/__router-health"
          echo "Checking Worker health..."

          STATUS="$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/worker-health.txt \
            --write-out '%{http_code}' \
            "$URL" || true)"

          BODY="$(cat /tmp/worker-health.txt 2>/dev/null || true)"

          if [[ "$STATUS" == "200" && "$BODY" == "ok" ]]; then
            echo "Worker health check passed."
          else
            echo "::warning::Custom-domain health check returned HTTP $STATUS."
            echo "The endpoint may be protected by Cloudflare challenge."
            echo "The direct browser test should return exactly: ok"
          fi

      - name: Verify custom domain response
        shell: bash
        run: |
          set -euo pipefail

          URL="https://echchiaa.elbordiji.com/"
          STATUS="$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/worker-home.txt \
            --write-out '%{http_code}' \
            "$URL" || true)"

          if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "Custom-domain endpoint returned HTTP $STATUS."
          else
            echo "::warning::Custom-domain endpoint returned HTTP $STATUS."
            echo "Check the browser and Worker logs for further diagnosis."
          fi
