name: Deploy custom-domain worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/custom-domain-router/**"
      - ".github/workflows/deploy-custom-domain-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-profile-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [[ -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [[ -z "$SB_ANON_KEY" ]]; then
            echo "::error::Missing SUPABASE_ANON_KEY"
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Verify Worker files
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/custom-domain-router/worker.js
          test -f workers/custom-domain-router/wrangler.toml

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Wrangler configuration
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --dry-run

      - name: Deploy Worker
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure Supabase Worker secret
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" |
            wrangler secret put SUPABASE_ANON_KEY

  verify:
    name: Live post-deployment checks
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE: https://echchiaa.elbordiji.com

    steps:
      - name: Wait for edge propagation
        run: sleep 20

      - name: Check Worker health with diagnostics
        shell: bash
        run: |
          set -u

          echo "Checking Worker health endpoint."

          curl -sS --retry 2 --retry-delay 5 \
            -D /tmp/health-headers.txt \
            -o /tmp/health-body.txt \
            -w 'HTTP status: %{http_code}\n' \
            "$BASE/__router-health" || true

          echo "Response headers:"
          cat /tmp/health-headers.txt

          echo "Response body:"
          cat /tmp/health-body.txt
          echo

          status=$(awk '
            toupper($1) ~ /^HTTP\// { code=$2 }
            END { print code }
          ' /tmp/health-headers.txt)

          body=$(cat /tmp/health-body.txt)

          if [[ "$status" != "200" || "$body" != "ok" ]]; then
            echo "::error::Worker health check failed with HTTP $status"
            exit 1
          fi

          echo "Worker health check passed."

      - name: Check homepage and tenant routing
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            -D /tmp/home-headers.txt \
            -o /tmp/home.html \
            "$BASE/"

          echo "Homepage response headers:"
          cat /tmp/home-headers.txt

          grep -qi \
            '^x-academic-profile-routed: default' \
            /tmp/home-headers.txt

          grep -q 'id="root"' /tmp/home.html

          echo "Homepage and tenant routing passed."

      - name: Check JavaScript asset
        shell: bash
        run: |
          set -euo pipefail

          html=$(curl -fsS "$BASE/")

          js=$(printf '%s' "$html" |
            grep -oE 'src="\./assets/[^"]+\.js"' |
            head -1 |
            sed 's/src="\.\///;s/"//')

          if [[ -z "$js" ]]; then
            echo "::error::JavaScript asset not found in homepage"
            exit 1
          fi

          code=$(curl -sS -o /dev/null \
            -w '%{http_code}' "$BASE/$js")

          echo "JavaScript asset: $js"
          echo "HTTP status: $code"

          test "$code" = "200"

      - name: Check CSS asset
        shell: bash
        run: |
          set -euo pipefail

          html=$(curl -fsS "$BASE/")

          css=$(printf '%s' "$html" |
            grep -oE 'href="\./assets/[^"]+\.css"' |
            head -1 |
            sed 's/href="\.\///;s/"//')

          if [[ -z "$css" ]]; then
            echo "::error::CSS asset not found in homepage"
            exit 1
          fi

          code=$(curl -sS -o /dev/null \
            -w '%{http_code}' "$BASE/$css")

          echo "CSS asset: $css"
          echo "HTTP status: $code"

          test "$code" = "200"

      - name: All checks passed
        run: echo "Worker and website checks passed."
