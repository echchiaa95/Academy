name: Deploy custom-domain worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/custom-domain-router/**'
      - '.github/workflows/deploy-custom-domain-worker.yml'

concurrency:
  group: custom-domain-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY is missing"
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/custom-domain-router
          command: deploy

      - name: Configure Supabase Worker secret
        shell: bash
        working-directory: workers/custom-domain-router
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://echchiaa.elbordiji.com"

          echo "Checking Worker health..."

          HEALTH="$(curl --fail --silent --show-error \
            --max-time 30 \
            "$BASE/__router-health")"

          echo "$HEALTH"

          if ! printf '%s' "$HEALTH" | grep -q '"ok"'; then
            echo "::error::Worker health check did not return the expected response."
            exit 1
          fi

      - name: Verify custom domain response
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://echchiaa.elbordiji.com"

          echo "Checking custom domain..."

          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$HEADERS" "$BODY"' EXIT

          STATUS="$(curl --silent --show-error \
            --max-time 30 \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            --write-out '%{http_code}' \
            "$BASE/")"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Custom domain did not return HTTP 200."
            cat "$BODY"
            exit 1
          fi

          if ! grep -qi '^x-academic-profile-routed:' "$HEADERS"; then
            echo "::error::Expected Worker routing header was not found."
            cat "$HEADERS"
            exit 1
          fi

          echo "Custom domain returned HTTP 200 through the Worker."
