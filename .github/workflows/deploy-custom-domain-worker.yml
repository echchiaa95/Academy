name: Deploy custom-domain worker

on:
  push:
    branches: [main]
    paths:
      - "workers/custom-domain-router/**"
      - ".github/workflows/deploy-custom-domain-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-profile-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CF_API_TOKEN" ]] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "$CF_ACCOUNT_ID" ]] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ -n "$SB_ANON_KEY" ]] || { echo "::error::Missing SUPABASE_ANON_KEY"; exit 1; }
          echo "Required secrets are configured."

      - name: Verify Worker files
        run: |
          test -f workers/custom-domain-router/worker.js
          test -f workers/custom-domain-router/wrangler.toml

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Wrangler configuration
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --dry-run

      - name: Deploy Worker
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure Supabase Worker secret
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY

  verify:
    name: Live post-deployment checks
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://echchiaa.elbordiji.com

    steps:
      - name: Wait for edge propagation
        run: sleep 20

      - name: Check Worker health
        run: |
          set -euo pipefail
          body=$(curl --retry 3 --retry-delay 5 -fsS "$BASE/__router-health")
          echo "health: $body"
          test "$body" = "ok"

      - name: Check homepage and routed tenant
        run: |
          set -euo pipefail
          headers=$(curl -fsSI "$BASE/")
          echo "$headers"
          echo "$headers" | grep -qi '^x-academic-profile-routed: default'
          html=$(curl -fsS "$BASE/")
          echo "$html" | grep -q 'id="root"'

      - name: Check JavaScript asset
        run: |
          set -euo pipefail
          html=$(curl -fsS "$BASE/")
          js=$(echo "$html" | grep -oE 'src="\./assets/[^"]+\.js"' | head -1 | sed 's/src="\.\///;s/"//')
          test -n "$js"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$js")
          echo "JS $js -> $code"
          test "$code" = "200"

      - name: Check CSS asset
        run: |
          set -euo pipefail
          html=$(curl -fsS "$BASE/")
          css=$(echo "$html" | grep -oE 'href="\./assets/[^"]+\.css"' | head -1 | sed 's/href="\.\///;s/"//')
          test -n "$css"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$css")
          echo "CSS $css -> $code"
          test "$code" = "200"
