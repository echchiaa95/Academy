name: Deploy custom-domain worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/custom-domain-router/**"
      - ".github/workflows/deploy-custom-domain-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-profile-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          [[ -n "$CF_API_TOKEN" ]] || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          }

          [[ -n "$CF_ACCOUNT_ID" ]] || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

          [[ -n "$SB_ANON_KEY" ]] || {
            echo "::error::Missing SUPABASE_ANON_KEY"
            exit 1
          }

          echo "Required secrets are configured."

      - name: Verify Worker files
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/custom-domain-router/worker.js
          test -f workers/custom-domain-router/wrangler.toml

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Wrangler configuration
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --dry-run

      - name: Configure Supabase Worker secret
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" |
            wrangler secret put SUPABASE_ANON_KEY

      - name: Deploy Worker
        working-directory: workers/custom-domain-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

  verify:
    name: Live post-deployment checks
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE: https://echchiaa.elbordiji.com

    steps:
      - name: Wait for edge propagation
        run: sleep 20

      - name: Check Worker health
        shell: bash
        run: |
          set -uo pipefail

          echo "Checking Worker health endpoint..."

          status=$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -D /tmp/health-headers.txt \
            -o /tmp/health-body.txt \
            -w '%{http_code}' \
            "$BASE/__router-health") || status="000"

          echo "HTTP status: $status"

          if [ -f /tmp/health-headers.txt ]; then
            echo "Response headers:"
            cat /tmp/health-headers.txt
          fi

          if [ -f /tmp/health-body.txt ]; then
            echo "Response body:"
            head -c 1000 /tmp/health-body.txt
            echo
          fi

          if [ "$status" = "200" ] &&
             [ "$(cat /tmp/health-body.txt 2>/dev/null)" = "ok" ]; then
            echo "Worker health check passed."
          elif grep -qi '^cf-mitigated: challenge' \
               /tmp/health-headers.txt 2>/dev/null; then
            echo "::warning::Cloudflare challenged the automated health request. Health status remains unverified."
          else
            echo "::warning::Health endpoint returned HTTP $status. Continuing to verify the actual website."
          fi

      - name: Check homepage and tenant routing
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            --connect-timeout 10 \
            --max-time 30 \
            -D /tmp/home-headers.txt \
            -o /tmp/home.html \
            "$BASE/"

          echo "Homepage response headers:"
          cat /tmp/home-headers.txt

          grep -qi \
            '^x-academic-profile-routed: default' \
            /tmp/home-headers.txt

          grep -q 'id="root"' /tmp/home.html

          echo "Homepage and tenant routing passed."

      - name: Check JavaScript asset
        shell: bash
        run: |
          set -euo pipefail

          html=$(curl -fsS --max-time 30 "$BASE/")

          js=$(printf '%s' "$html" |
            grep -oE 'src="\./assets/[^"]+\.js"' |
            head -1 |
            sed 's/src="\.\///;s/"//')

          if [ -z "$js" ]; then
            echo "::error::JavaScript asset not found in homepage."
            exit 1
          fi

          code=$(curl -sS --max-time 30 \
            -o /dev/null \
            -w '%{http_code}' \
            "$BASE/$js")

          echo "JavaScript asset: $js"
          echo "HTTP status: $code"

          test "$code" = "200"

      - name: Check CSS asset
        shell: bash
        run: |
          set -euo pipefail

          html=$(curl -fsS --max-time 30 "$BASE/")

          css=$(printf '%s' "$html" |
            grep -oE 'href="\./assets/[^"]+\.css"' |
            head -1 |
            sed 's/href="\.\///;s/"//')

          if [ -z "$css" ]; then
            echo "::error::CSS asset not found in homepage."
            exit 1
          fi

          code=$(curl -sS --max-time 30 \
            -o /dev/null \
            -w '%{http_code}' \
            "$BASE/$css")

          echo "CSS asset: $css"
          echo "HTTP status: $code"

          test "$code" = "200"

      - name: Website checks passed
        run: |
          echo "The website, tenant routing, JavaScript, and CSS checks passed."
