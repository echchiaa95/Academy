name: Deploy custom-domain worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/custom-domain-router/**'
      - '.github/workflows/deploy-custom-domain-worker.yml'

concurrency:
  group: custom-domain-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub repository secrets"
              exit 1
            fi
          done

          echo "Required secrets are configured."

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Verify Wrangler configuration
        working-directory: workers/custom-domain-router
        run: |
          set -euo pipefail
          test -f worker.js
          test -f wrangler.toml
          wrangler --version
          cat wrangler.toml

      - name: Deploy Worker
        working-directory: workers/custom-domain-router
        run: wrangler deploy

      - name: Configure Supabase Worker secret
        working-directory: workers/custom-domain-router
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://echchiaa.elbordiji.com"

          echo "Checking Worker health..."

          STATUS="$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/worker-health.txt \
            --write-out '%{http_code}' \
            "$BASE/__router-health")"

          HEALTH="$(cat /tmp/worker-health.txt)"

          echo "HTTP status: $STATUS"
          echo "Health response: $HEALTH"

          if [ "$STATUS" != "200" ] || [ "$HEALTH" != "ok" ]; then
            echo "::error::Worker health check failed."
            exit 1
          fi

          echo "Worker health check passed."

      - name: Verify custom domain response
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://echchiaa.elbordiji.com"
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$HEADERS" "$BODY"' EXIT

          echo "Checking custom domain..."

          STATUS="$(curl --silent --show-error \
            --max-time 30 \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            --write-out '%{http_code}' \
            "$BASE/")"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Custom domain did not return HTTP 200."
            cat "$BODY"
            exit 1
          fi

          if ! grep -qi '^x-academic-profile-routed:' "$HEADERS"; then
            echo "::error::Worker routing header was not found."
            cat "$HEADERS"
            exit 1
          fi

          echo "Custom domain successfully routed through the Worker."
